  /api/v1/ui/scans/{id}/log:
    get:
      summary: Scan log from a byte offset
      operationId: getUIScanLog
      tags:
        - ui-scans
      description: |-
        Returns `log[offset:]` (byte offset). `X-Log-Length` is the total log length in bytes the body ends at, in the
        same byte space as `scan-log` SSE event offsets. Protocol: subscribe to `/v1/ui/events?scan={id}` first, then
        fetch `offset=0`, drop events whose `offset <= X-Log-Length`, and refetch `?offset=<last offset>` on a gap.
        While the scan runs the body is served from an in-memory mirror of the published lines, so it is never behind
        the event stream (the worker flushes the stored log only every few seconds). An offset past the end returns an
        empty body.
      parameters:
        - $ref: '#/components/parameters/UIPathID'
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Log bytes
          headers:
            X-Scan-Status:
              description: The scan's status when the log was read
              schema:
                type: string
            X-Log-Length:
              description: Total log length in bytes after this body
              schema:
                type: integer
                format: int64
            X-Portal-Scope:
              $ref: '#/components/headers/PortalScope'
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/UIBadParam'
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '404':
          $ref: '#/components/responses/UINotFound'
        '500':
          $ref: '#/components/responses/UIInternal'
        '503':
          $ref: '#/components/responses/UIUnavailable'
