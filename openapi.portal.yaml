    PortalAccessStatus:
      type: object
      required: [state, found]
      properties:
        state:
          type: string
          enum: [idle, loading, ready, error, unauthorized]
        found:
          type: integer
          description: Repositories GitHub has reported so far.
        partial:
          type: boolean
          description: Set while loading once requests are served on the repositories found so far.
    PortalSessionAccess:
      type: object
      required: [state, found, partial]
      properties:
        state:
          type: string
          enum: [idle, loading, ready, error, unauthorized]
        found: {type: integer}
        partial: {type: boolean}
    PortalVersion:
      type: object
      required: [version, commit, commit_date]
      properties:
        version: {type: string}
        commit: {type: string}
        commit_date: {type: string}
    PortalSession:
      type: object
      required: [authenticated, login, github_user_id, expires_at, access, version]
      properties:
        authenticated: {type: boolean, const: true}
        login: {type: string}
        github_user_id: {type: integer, format: int64}
        expires_at: {type: string, format: date-time}
        access: {$ref: '#/components/schemas/PortalSessionAccess'}
        version: {$ref: '#/components/schemas/PortalVersion'}
    PortalExternalRepository:
      type: object
      required: [name, url]
      properties:
        name: {type: string, description: owner/name on GitHub}
        url: {type: string}
    PortalInsufficientRepository:
      type: object
      required: [name, url, access]
      properties:
        name: {type: string}
        url: {type: string}
        access:
          type: string
          description: Display label, e.g. "Read access", "Triage access", "Insufficient permission".
    PortalAccess:
      type: object
      required: [authorized_repo_count, scanned_repo_count, repository_ids, unscanned, insufficient, incomplete]
      properties:
        authorized_repo_count:
          type: integer
          description: External repositories the visitor may see, scanned or not.
        scanned_repo_count:
          type: integer
          description: Scrutineer repositories in scope (len of repository_ids).
        repository_ids:
          type: array
          items: {type: integer}
          description: Scrutineer repository ids in scope, ascending.
        unscanned:
          type: array
          items: {$ref: '#/components/schemas/PortalExternalRepository'}
        insufficient:
          type: array
          items: {$ref: '#/components/schemas/PortalInsufficientRepository'}
        incomplete:
          type: boolean
          description: The lookup is still running; more repositories may appear.
