  /auth/login:
    get:
      summary: Start GitHub sign-in
      operationId: portalLogin
      tags: [portal-auth]
      security: []
      description: |
        A document navigation, not a fetch. Sets a short-lived state cookie
        carrying `next` and redirects to GitHub's authorize page. With the
        loopback dev identity it signs in directly and redirects to `next`.
      parameters:
        - name: next
          in: query
          required: false
          description: |
            Same-origin path to land on after sign-in. Honoured only when it
            starts with a single `/` (not `//` or `/\`) and contains no
            backslash or control character; anything else lands on `/`.
          schema: {type: string}
      responses:
        '302':
          description: Redirect to GitHub (or, in dev mode, to `next`)
  /auth/callback:
    get:
      summary: GitHub OAuth callback
      operationId: portalCallback
      tags: [portal-auth]
      security: []
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '302':
          description: Signed in; redirect to the `next` carried in the state cookie (default `/`)
        '400':
          description: Invalid OAuth state or missing code (text/plain)
        '502':
          description: GitHub exchange or identity lookup failed (text/plain)
  /auth/status:
    get:
      summary: Repository lookup progress
      operationId: portalAccessStatus
      tags: [portal-auth]
      security: []
      description: Never starts a lookup. Clears the session cookie when the state is `unauthorized`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalAccessStatus'}
  /auth/session:
    get:
      summary: Current visitor
      operationId: portalSession
      tags: [portal-auth]
      description: |
        Never blocks and never starts a repository lookup, so it is safe to
        poll. `access` is the lookup state `/auth/status` reports.
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalSession'}
        '401':
          $ref: '#/components/responses/UIUnauthorized'
  /auth/access:
    get:
      summary: The visitor's repository access
      operationId: portalAccess
      tags: [portal-auth]
      description: |
        Waits for the first repository lookup for at most 20 s, then answers
        on the repositories found so far with `incomplete: true` (and
        `X-Portal-Scope: partial`).
      responses:
        '200':
          description: OK
          headers:
            X-Portal-Scope: {$ref: '#/components/headers/PortalScope'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortalAccess'}
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '500':
          $ref: '#/components/responses/UIInternal'
        '503':
          $ref: '#/components/responses/UIUnavailable'
  /auth/logout:
    post:
      summary: Sign out
      operationId: portalLogout
      tags: [portal-auth]
      security: []
      description: |
        Revokes the OAuth app's grant on GitHub (best effort), drops the
        cached repository access and clears the session cookie. Requires
        `Sec-Fetch-Site: same-origin`.
      parameters:
        - name: Accept
          in: header
          required: false
          description: '`application/json` selects the 204 answer.'
          schema: {type: string}
      responses:
        '204':
          description: Signed out (Accept application/json)
        '303':
          description: Signed out; redirect to `/auth/login` (any other Accept)
        '403':
          description: Cross-site request (text/plain)
  /repositories/{id}/report.md:
    get:
