    then scoped server-side to the repositories that visitor maintains
    (ADMIN, MAINTAIN or WRITE) plus operator-configured access grants.

    The `/api/v1/ui/*` operations are the subset of scrutineer's v2 UI API
    the portal forwards (GET only, default deny); their schemas are the same
    as in `openapi.yaml`. An id outside the visitor's scope answers 404
    `not_found`, exactly like an id that does not exist.

    Authentication is the HttpOnly session cookie `scrutineer_sharing`; no
    token is readable by JavaScript and there is no CORS. Every non-GET/HEAD
    request must carry `Sec-Fetch-Site: same-origin`. The only state-changing
    operation is `POST /auth/logout`.

    API responses carry `Cache-Control: no-store`, `Vary: Cookie` and
    `X-Portal-Scope: complete|partial`. A missing or expired session answers
    401 `unauthorized` (never a redirect); a GitHub outage answers 503
    `unavailable` and keeps the session.
