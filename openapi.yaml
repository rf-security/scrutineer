            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/UIBadParam'
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '500':
          $ref: '#/components/responses/UIInternal'
  /v1/ui/events:
    get:
      summary: JSON server-sent events stream
      operationId: getUIEvents
      tags:
      - ui-core
      description: 'Same broker and scoping as the legacy /events: a 0/absent filter means any; an event is delivered when every
        non-zero filter matches and its name is in `events` (or `events` is absent). Each `data:` is one JSON object whose schema
        is named per event: scan=SSEScanEvent, scans=SSEScansEvent, scan-log=SSEScanLogEvent, finding=SSEFindingEvent, repository=SSERepositoryEvent,
        sbom=SSESBOMEvent, queue=Activity, meta=SSEMetaEvent, chat-activity=SSEChatActivityEvent, chat-done=SSEChatDoneEvent.
        A `: ping` comment is sent every 15 s. No replay (Last-Event-ID unsupported). Never subscribe to scan-log unscoped.'
      security:
      - operatorToken: []
      - operatorCookie: []
      parameters:
      - name: scan
        in: query
        schema:
          type: integer
          format: int64
      - name: repo
        in: query
        schema:
          type: integer
          format: int64
      - name: conv
        in: query
        schema:
          type: integer
          format: int64
      - name: finding
        in: query
        schema:
          type: integer
          format: int64
      - name: events
        in: query
        schema:
          type: string
        description: Comma-separated event names; absent = every name.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; payload per event name in UIEventPayloads
                contentMediaType: text/event-stream
                x-event-payloads:
                  $ref: '#/components/schemas/UIEventPayloads'
        '400':
          $ref: '#/components/responses/UIBadParam'
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '500':
          $ref: '#/components/responses/UIInternal'
  /v1/ui/activity:
    get:
      summary: Queue and findings counters for nav badges
      operationId: getUIActivity
      tags:
      - ui-core
      security:
      - operatorToken: []
      - operatorCookie: []
      responses:
