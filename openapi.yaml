  /v1/ui/search:
    get:
      summary: Global search across entity kinds
      operationId: getUISearch
      tags:
      - ui-core
      description: Numeric `q` also matches ids (`#123` finding, `s4753` scan).
      security:
      - operatorToken: []
      - operatorCookie: []
