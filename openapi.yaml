        rules: rejected needs verdict+reason, ready needs a saved draft, reported runs the federation claim gate),
        then the label delta. No If-Match. Per-item failures are reported in `results` with the envelope code
        (validation_failed, precondition_failed, federation_claimed, not_found, ...); the call itself is 200.
