        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '500':
          $ref: '#/components/responses/UIInternal'
    patch:
      summary: Autosave finding fields (slim response)
      operationId: patchUIFinding
      tags:
      - ui-findings
      security:
      - operatorToken: []
      - operatorCookie: []
      parameters:
      - $ref: '#/components/parameters/UIPathID'
      - $ref: '#/components/parameters/UIIfMatch'
      - $ref: '#/components/parameters/UIPrefer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindingPatchRequest'
      description: |
        Partial, field-level autosave. Accepts analystFields plus exploited_in_wild(_evidence); status and every
        automation-owned field are 422. Multi-field bodies run in one transaction. A value equal to the stored one
        is a no-op. 409 `conflict` (with `current` FindingRow and `fields` naming the moved fields) when a
        `previous` value differs from the stored one, or when `If-Match` is stale and that field itself changed
        since (field history, not the whole-row updated_at, which worker writes also bump). Publishes one
        `finding` event with the written field names. `Prefer: return=representation` returns UIFindingDetail.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPatchResponse'
          headers:
            ETag:
              $ref: '#/components/headers/UIETag'
        '400':
          $ref: '#/components/responses/UIBadParam'
        '404':
          $ref: '#/components/responses/UINotFound'
        '409':
          $ref: '#/components/responses/UIConflict'
        '422':
          $ref: '#/components/responses/UIValidationFailed'
        '503':
          $ref: '#/components/responses/UIUnavailable'
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '500':
          $ref: '#/components/responses/UIInternal'
