openapi: 3.1.0
info:
  title: Scrutineer Skill API
  version: 0.4.0
  description: |
    A narrow HTTP surface that claude-code skills use while they run. The
    goal is enough to let a skill orchestrate other skills and read prior
    scan outputs without pushing that logic into scrutineer's Go code.

    Every scrutineer skill scan is issued a bearer token that is staged into
    the workspace context.json. Skills authenticate with that token. A token
    is only valid while its originating scan is running, and only grants
    access to the repository the scan was issued against.

    The `/v1/*` paths are the operator's localhost-only export, import and
    delete surface, intended for external scripts (jq, cron, CI dumps). They
    require the operator token from `<data>/operator-token` and the same
    host-header check as the browser UI; see docs/api.md and threatmodel.md.

servers:
  - url: http://127.0.0.1:8080/api
    description: Local scrutineer server

security:
  - bearerAuth: []

paths:
  /openapi.yaml:
    get:
      summary: Fetch this OpenAPI document
      description: |
        Returns the embedded copy of `openapi.yaml`, so a skill or an external
        tool can read the API surface from a running server without a checkout.

        Two ways in. From localhost it is unauthenticated, because a caller
        discovering the API has no running scan to take a bearer token from;
        the host check is the boundary, without the operator token the
        browser UI requires. A skill inside
        the runner container cannot pass that check -- it reaches the server
        through the egress proxy on the host endpoint `api_base` advertises,
        which forwards the original `Host` -- so it authenticates with the
        per-scan bearer token it already holds for the rest of this API.
        See threatmodel.md.
      operationId: getOpenAPISpec
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
        "401":
          description: |
            Request came from a non-local host without a bearer token
            belonging to a currently running scan
  /claim-check:
    servers:
      - url: http://127.0.0.1:8080
        description: Local scrutineer server root
    post:
      summary: Check whether this instance already holds a federated finding claim
      description: |
        Accepts a salted finding hash from a federation peer and returns whether
        this instance already has a claimable matching finding. The request does
        not reveal the finding; a match discloses only the configured operator
        contact. Disabled instances, non-POST requests, and instances without a
        federation salt answer 404 so federation support is not fingerprintable.
      operationId: claimCheck
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Claim-check result
          content:
            application/json:
              schema:
                type: object
                required: [match]
                properties:
                  match: { type: boolean }
                  contact:
                    type: string
                    description: Present only when match is true and federation contact is configured.
        '400':
          description: Invalid JSON body or hash value
        '404':
          description: Claim check disabled or unsupported method
        '500':
          description: Failed to load local findings

  /repositories/{id}:
    get:
      summary: Fetch a repository summary
      operationId: getRepository
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update skill-writable repository fields
      description: |
        Allows the authenticated scan to write repository fields that are
        produced by skills rather than owned by metadata refreshes. Currently
        only `fork` is accepted.
      operationId: patchRepository
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fork]
              properties:
                fork:
                  type: string
                  description: Owner/name of the staging fork prepared for patch work.
      responses:
        '204':
          description: Repository updated
        '400':
          description: Body is not valid JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: No writable fields were supplied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Database update failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /repositories/{id}/scans:
    get:
      summary: List scans for a repository
      operationId: listRepositoryScans
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, paused, done, failed, skipped, cancelled]
        - name: skill
          in: query
          schema: { type: string }
          description: Filter by skill name (matches Scan.skill_name).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Scan' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/maintainers:
    get:
      summary: List maintainers linked to this repository
      operationId: listRepositoryMaintainers
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Maintainer' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/packages:
    get:
      summary: List published packages produced by this repository
      operationId: listRepositoryPackages
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Package' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/alternatives:
    get:
      summary: List operator-curated package migration alternatives
      operationId: listRepositoryAlternatives
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PackageAlternative' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/advisories:
    get:
      summary: List published advisories affecting this repository's packages
      operationId: listRepositoryAdvisories
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Advisory' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/dependents:
    get:
      summary: List downstream dependents of this repository's packages
      operationId: listRepositoryDependents
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - $ref: '#/components/parameters/RepositoryReadLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dependent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/ecosystems/{source}/raw:
    get:
      summary: Verbatim cached ecosyste.ms payload for one source
      description: >
        Returns the raw upstream payload pre-fetched and cached server-side.
        A 404 signals nothing is cached, in which case the caller falls
        back to a direct WebFetch. When the operator sets
        ecosystems_enrichment false, no source is ever cached, so every
        request answers 404 and the fallback is the only path.
      operationId: getRepositoryEcosystemsRaw
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [repo, packages, advisories, commits, issues, dependents]
      responses:
        '200':
          description: Cached payload, returned verbatim
          content:
            application/json: {}
        '400':
          description: Unknown source
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{id}/expected:
    get:
      summary: List expected findings for benchmark comparison
      operationId: listRepositoryExpectedFindings
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExpectedFinding' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /repositories/{id}/dependencies:
    get:
      summary: List dependencies declared by this repository's manifests
      operationId: listRepositoryDependencies
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - $ref: '#/components/parameters/RepositoryReadLimit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dependency' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/findings:
    get:
      summary: List findings across every scan on this repository
      operationId: listRepositoryFindings
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - name: severity
          in: query
          schema: { type: string, enum: [Critical, High, Medium, Low] }
        - name: status
          in: query
          schema:
            type: string
            enum: [new, enriched, triaged, ready, reported, acknowledged, fixed, published, rejected, duplicate]
        - name: skill
          in: query
          description: Only return findings produced by scans of this skill (e.g. `semgrep`, `security-deep-dive`).
          schema: { type: string }
        - name: scan_group
          in: query
          description: Only return findings from scans in this parallel batch, so an in-flight audit skill reads only its siblings' findings.
          schema: { type: string }
        - name: sub_path
          in: query
          description: Exact match on the monorepo sub-package; `.` selects repository-root findings. Omit to return all findings.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Stream one finding into the concurrent-finding log
      description: >
        Records a single finding emitted mid-scan so sibling scans in the same
        `scan_group` can read it before this scan completes. The body is one
        finding in the same shape it has in the skill's `report.json`; the
        scan's identity (scan id, repository, commit, subpath) is stamped from
        the bearer token, never trusted from the body. The finding still
        belongs in the final `report.json`, which reconciles against the
        streamed row by fingerprint rather than duplicating it.
        If PoC capture fails, the finding is still saved and the 201 response
        includes `poc_capture_error`. Correct the files and publish again to
        retry capture.
      operationId: streamRepositoryFinding
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/dependency-findings:
    get:
      summary: List findings on libraries this repository depends on
      description: >
        Joins this repository's Dependency rows against every Package row
        scrutineer knows about and returns the live findings on the matched
        library repositories. git-pkgs ecosystem names (gem, golang,
        composer) are normalised to packages.ecosyste.ms names (rubygems,
        go, packagist) before matching. Findings already marked fixed,
        rejected or duplicate are excluded. Consumed by the reachability
        skill.
      operationId: listRepositoryDependencyFindings
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - name: severity
          in: query
          schema: { type: string, enum: [Critical, High, Medium, Low] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DependencyFinding' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /repositories/{id}/skills/{name}/run:
    post:
      summary: Enqueue a skill scan against this repository
      operationId: runSkill
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: Skill name (matches the SKILL.md `name` field).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model:
                  type: string
                  description: Override model; defaults to the system default.
                ref:
                  type: string
                  description: Git ref to checkout; empty means the repository's default branch.
                sub_path:
                  type: string
                  description: |
                    Scope this run to a monorepo sub-package (a relative sub-folder, e.g. `activesupport`).
                    The `triage` skill forwards it to every pipeline child so the whole scan set stays
                    scoped to the same sub-package. Empty means the whole repository. A `..` segment is rejected.
                profile:
                  type: string
                  description: |
                    Runner profile name (e.g. `php`). Empty auto-detects from the clone via `brief`;
                    `default` forces the default runner image. Unknown names return 400, as do
                    overrides that conflict with the skill's `requires_profile` constraint.
                rescan_mode:
                  type: string
                  enum: [full, diff]
                  description: |
                    `diff` asks Scrutineer to compare the current commit against a compatible baseline
                    scan and stage `diff.patch` plus `changed_files.json` for diff-aware skills. The
                    worker falls back to a full scan when no usable baseline exists or the diff exceeds
                    safety limits.
                baseline_scan_id:
                  type: integer
                  format: int64
                  description: |
                    Optional baseline scan to use for `rescan_mode: diff`; omitted lets Scrutineer
                    choose the latest compatible completed scan.
                max_cost_usd:
                  type: number
                  minimum: 0
                  description: |
                    Optional spend cap in USD for this scan. When the running cost estimate reaches it the
                    worker stops the run, asks the agent to write its report from the work so far and
                    records the scan as done with partial coverage and reason `cost_cap`. Omitted or 0
                    means no cap. Negative values return 400. The cap does not apply to the codex
                    backend, which emits no usage events.
      responses:
        '201':
          description: Scan enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '400':
          description: Bad request (unknown profile, profile mismatch with the skill's `requires_profile`, invalid ref, or invalid `rescan_mode`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Skill or repository not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'The repository maintainer opted out of federated scanning, so no scan may be enqueued for it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /findings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: Fetch one finding with its six-step prose
      operationId: getFinding
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update mutable fields on a finding
      operationId: patchFinding
      description: |
        The authenticated scan must be finding-scoped to this finding ID.
        Each field value is written through the history-tracked path.
        Finding-scoped skills write with source=model_suggested; browser
        form edits use separate routes and write with source=analyst.
        Unknown field names are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                by:
                  type: string
                  description: Optional author string for the history row.
                fields:
                  type: object
                  additionalProperties: { type: string }
                  description: |
                    Map of field name to new value. Allowed fields:
                    title, severity, status, cwe, location, affected, reachability, quality_tier,
                    cve_id, ghsa_id, cvss_vector, cvss_v4_vector, fix_version, fix_commit,
                    resolution, disclosure_draft, disclosure_title, suggested_recipients, assignee,
                    suggested_fix, suggested_fix_commit, breaking_change, breaking_change_rationale,
                    exploited_in_wild, exploited_in_wild_evidence, mitigation, mitigation_semgrep,
                    release_tag, release_url, last_revalidate_verdict.
      responses:
        '204': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /findings/{id}/bundle.tar.gz:
    get:
      summary: Disclosure bundle for one finding
      operationId: getFindingBundle
      description: |
        A gzipped tar containing every per-finding export scrutineer
        produces (OSV, CSAF, markdown report, patch.diff when one is on
        file) plus a manifest.json header naming the finding and the
        archive contents. The per-file bytes are identical to what the
        matching /findings/{id}/{file} endpoint serves directly; the
        bundle is a composition, not a new format. Shape mirrors the
        OSS-SIRT intake brief: one summary line, aliases for
        cross-system identifiers, contents map.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: tar.gz archive.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        '404': { description: Finding not found }
        '410': { description: Finding is a duplicate; bundle unavailable }
        '500': { description: Underlying export failed }

  /findings/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List notes on a finding
      operationId: listFindingNotes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingNote' }
    post:
      summary: Append a note to a finding
      operationId: addFindingNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                by:   { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingNote' }

  /findings/{id}/observations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List scan observations of a finding
      description: >
        Every scan's own report of the finding, plus those of findings that
        finding-dedup merged into it as duplicates, oldest first. Rows are
        immutable history and carry the content each scan reported, which may
        differ from the finding itself. Agreement between rows is not
        verification. Evidence is untrusted model output.
      operationId: listFindingObservations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingObservation' }
        '404': { description: Finding not found }

  /findings/{id}/reviews:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List structured human verdicts on a finding
      operationId: listFindingReviews
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingReview' }
  /v1/audit/queue:
    get:
      summary: Sample of recently auto-bucketed findings without a recorded review
      description: |
        Returns findings the automation has bucketed as not worth pursuing
        (low-severity, rejected, or marked by revalidate as false positive,
        already fixed, or uncertain) and that do not yet have a
        FindingReview row. Spot-check the queue to keep automated triage
        calibrated.

        Instance-wide; requires the operator token like the other
        `/v1/*` exports. Not reachable with a
        per-scan bearer token.
      operationId: getAuditQueue
      security: [{ operatorToken: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
        - name: since
          in: query
          description: RFC3339 timestamp; excludes findings older than this.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  description: Raw db.Finding row (PascalCase keys). Superseded for the UI by `/v1/ui/audit`.

  /v1/audit/metrics:
    get:
      summary: Aggregate audit metrics
      description: |
        Total reviews, those comparable to an automation outcome,
        agreements between human verdict and automation, and the
        agreement rate (0..1). The audit page renders the same numbers.

        Instance-wide; requires the operator token like the other
        `/v1/*` exports.
      operationId: getAuditMetrics
      security: [{ operatorToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  TotalReviews: { type: integer }
                  WithAutomatedOutcome: { type: integer }
                  Agreements: { type: integer }
                  AgreementRate: { type: number, format: float }
                  ByVerdict:
                    type: object
                    additionalProperties: { type: integer }

  /findings/{id}/communications:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List logged communications for a finding
      operationId: listFindingCommunications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingCommunication' }
    post:
      summary: Log a communication (sent or received) about a finding
      operationId: addFindingCommunication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingCommunication' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingCommunication' }

  /findings/{id}/references:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      summary: List references attached to a finding
      operationId: listFindingReferences
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingReference' }
    post:
      summary: Attach an external reference to a finding
      operationId: addFindingReference
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingReference' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingReference' }

  /findings/{id}/submissions:
    post:
      summary: Record a report a skill filed with an outside recipient
      description: |
        Records a GitHub private vulnerability report filed by the report-upstream skill. In one write it stores
        the submission with the report as sent, adds a ghsa-upstream reference and an outbound communication,
        moves a finding not yet reported to reported, and logs disclosure.pvr_submitted. Requires a scan token
        scoped to the finding.
      operationId: recordFindingSubmission
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, external_id, url, body, request]
              properties:
                channel: { type: string, enum: [pvr] }
                endpoint: { type: string, description: Where the report was sent. }
                external_id: { type: string, description: The GHSA ID. }
                url: { type: string, description: The advisory page. }
                summary: { type: string, description: Summary for the reference. }
                actor: { type: string }
                body: { type: string, description: The outbound communication text. }
                request: { type: object, description: The report body exactly as sent. }
                response: { type: object, description: The recipient response. }
      responses:
        '201':
          description: Created
        '403':
          description: The scan token is not scoped to this finding.
        '412':
          description: The finding is not viable for disclosure.
        '422':
          description: Missing fields or a channel other than pvr.

  /findings/{id}/labels:
    put:
      summary: Replace the set of labels on a finding
      operationId: setFindingLabels
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [labels]
              properties:
                labels:
                  type: array
                  items: { type: string }
                  description: |
                    Label names, replacing the finding's current set. Missing
                    labels are created on demand. Blank and whitespace-only
                    names are trimmed and ignored, so a request whose names are
                    all blank clears every label just as `[]` does. The field
                    itself is required: omitting it or sending null is rejected
                    rather than treated as a clear-all.
      responses:
        '204': { description: Updated }
        '400':
          description: Body is not valid JSON, or has no labels array
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /findings/{id}/history:
    get:
      summary: List the history rows recorded for a finding
      operationId: listFindingHistory
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FindingHistory' }

  /findings/{id}/skills/{name}/run:
    post:
      summary: Enqueue a finding-scoped skill (verify, revalidate, patch, reattack, disclose)
      operationId: runFindingSkill
      description: |
        The authenticated scan's repository must own the finding. The scan
        that gets enqueued has FindingID set so its skill body can read
        `scrutineer.finding_id` from context.json and act on one finding
        specifically.
        A `reattack` enqueue ignores a caller-supplied ref and pins the scan to
        the newest immutable gated patch attempt and its base commit. It returns
        412 when the finding has no gated patch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
          description: Finding id.
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: Skill name.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                model: { type: string }
                max_cost_usd:
                  type: number
                  minimum: 0
                  description: |
                    Optional spend cap in USD for this scan. When the running cost estimate reaches it the
                    worker stops the run, asks the agent to write its report from the work so far and
                    records the scan as done with partial coverage and reason `cost_cap`. Omitted or 0
                    means no cap. Negative values return 400. The cap does not apply to the codex
                    backend, which emits no usage events.
      responses:
        '201':
          description: Scan enqueued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Finding or skill not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 'The repository maintainer opted out of federated scanning, so no scan may be enqueued for it, or a federation peer already holds this finding and an outreach skill was asked to report it.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '412':
          description: A re-attack was requested but the finding has no reproducible gated patch attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scans/{id}:
    get:
      summary: Fetch a scan with its report (if complete)
      operationId: getScan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scans/{id}/validate-report:
    post:
      summary: Validate a candidate report.json against the skill's schema
      description: >
        Lets a running skill check its report against its skill's schema using
        scrutineer's own validator, instead of installing a JSON Schema library
        inside the runner container. The request body is the candidate report
        JSON; a 200 response carries {"valid": true} when it conforms, or
        {"valid": false, "errors": "..."} listing the failures. A skill with no
        schema returns {"valid": true, "note": "skill has no schema"}. The token
        may only validate the scan it was issued for. Body is capped at 1 MB.
      operationId: validateReport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Validation result (valid true or false; never a schema error)
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  errors: { type: string }
                  note: { type: string }
                required: [valid]
        '400':
          description: Scan has no associated skill
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Report body exceeds the 1 MB limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /skills:
    get:
      summary: List installed skills
      operationId: listSkills
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
          description: >
            Filter by active state. An empty value applies no filter; a value
            that is not a boolean returns 400.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SkillSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /cnas:
    get:
      summary: List CVE Numbering Authorities
      description: >
        Cached copy of the cve.org partner list. Global, not repo-scoped.
        Use q to substring-match across short_name, organization, and scope.
      operationId: listCNAs
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    short_name:   { type: string }
                    cna_id:       { type: string }
                    organization: { type: string }
                    scope:        { type: string }
                    email:        { type: string }
                    contact_url:  { type: string }
                    policy_url:   { type: string }
                    advisory_url: { type: string }
                    root:         { type: string }
                    types:        { type: string }

  /v1/repositories:
    get:
      summary: Export repositories as JSONL
      description: |
        Returns one JSON object per line (`application/x-ndjson`) for the
        Repositories tab data set. Each line includes selected scalar
        repository columns, the latest scan summary, and the same curated
        findings count shown in the UI. Large metadata and ecosystems cache
        blobs are intentionally omitted to keep the payload suitable for
        automation. Operator token; localhost-only.
      operationId: exportRepositories
      security: [{ operatorToken: [] }]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [jsonl] }
      responses:
        '200':
          description: JSONL stream of RepositoryExport objects, one per line.
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/RepositoryExport' }
        '400':
          description: Unsupported format query value, or `encrypt`/`scope`/`include` requested (`scope` is only valid on the per-repository and `/v1/findings` exports, `encrypt`/`include` on per-repository bundle exports).
        '403':
          description: Host header is not localhost

  /v1/repositories/{id}:
    get:
      summary: Get one repository
      description: |
        Returns one repository with the same shape as a line of the
        repositories JSONL export: selected scalar columns, the latest scan
        summary and the curated findings count. Operator token;
        localhost-only. Not reachable with a per-scan bearer token.
      operationId: getRepositoryExport
      security: [{ operatorToken: [] }]
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '200':
          description: The repository.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryExport' }
        '400': { description: 'Invalid repository id, or an unsupported `format` or an `encrypt`, `scope` or `include` query value' }
        '403': { description: Host header is not localhost }
        '404': { description: Repository not found }
    delete:
      summary: Delete a repository and its linked data
      description: |
        Host-only operator endpoint for local automation. Removes the
        repository, its scans, findings, repository-scoped rows, chat
        conversations, and cached clone/workspace artifacts using the same
        cleanup path as the browser delete action. Not reachable with a
        per-scan bearer token.
      operationId: deleteRepository
      security: [{ operatorToken: [] }]
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
      responses:
        '204': { description: Repository deleted }
        '400': { description: Invalid repository id }
        '403': { description: Host header is not localhost }
        '404': { description: Repository not found }
        '409': { description: Repository has queued or running scans, or a linked paused scan on another repository }
        '500': { description: Delete failed }

  /v1/repositories/{id}/findings:
    get:
      summary: Export findings for a repository (JSONL, a shareable bundle, or SARIF)
      description: |
        With `format=jsonl` (the default) returns one JSON object per line
        (`application/x-ndjson`), each a `FindingExport` carrying the full set
        of `db.Finding` columns. With `format=bundle` returns a single
        self-contained JSON document (the minimal ingest shape) that
        round-trips through `/v1/import`. The default bundle is share-safe: it
        carries finding substance (the six-step audit narrative, reachability,
        sinks, VID, provenance) but not the analyst's private workspace or the
        recipient's triage — status, assignee, resolution, notes, and
        communications stay out.

        Adding `include=all` (bundle only) promotes the bundle to an archival
        superset for round-tripping a repo's findings back into your own
        instance: on top of the default it carries the enrichment and disclosure
        work product (snippet, affected, fix_version, CVE/GHSA id, CVSS vectors,
        mitigation, breaking-change verdict, dup-check, disclosure draft,
        exploited-in-wild, upstream fix commit) and the notes, communications,
        and references child records. Instance-local lifecycle (status,
        resolution, assignee), the change history, release-watch, and labels are
        never carried. It is opt-in because notes/communications are internal and
        snippet embeds verbatim source, which a cross-party share must not leak.

        Adding `encrypt=1` (bundle only) wraps the bundle in armored age,
        encrypted to every configured recipient. Adding `scope=findings` (any
        format) curates the export to the Findings bucket (deep-dive and
        vuln-scan audits plus operator imports), dropping per-repo scanner
        noise.

        With `format=sarif` returns one SARIF 2.1.0 log with a run per
        observed revision. Disclosure drafts, recipients, notes and
        communications are never included, and each result records its latest
        `verify` outcome (or `unverified`) apart from the audit's own evidence.
        See docs/sarif-export.md for the field mapping. Operator token;
        localhost-only.
      operationId: exportRepositoryFindings
      security: [{ operatorToken: [] }]
      parameters:
        - $ref: '#/components/parameters/RepositoryID'
        - name: format
          in: query
          description: |
            `jsonl` (default) streams NDJSON; `bundle` returns one JSON sharing
            document; `sarif` returns one SARIF 2.1.0 log. Other values get a
            400.
          schema: { type: string, enum: [jsonl, bundle, sarif] }
        - name: encrypt
          in: query
          description: |
            Any non-empty value wraps a `format=bundle` export in armored age,
            encrypted to the configured recipients. Requires `format=bundle`
            and at least one configured recipient, else 400.
          schema: { type: string }
        - name: scope
          in: query
          description: |
            `findings` curates a `jsonl`, `bundle` or `sarif` export to the Findings
            bucket (deep-dive and vuln-scan audits plus operator imports),
            excluding per-repo scanner noise. It combines with `severity` and
            `status`. Any other value, or use on the cross-repo
            `/v1/repositories` and `/v1/scans` endpoints, gets a 400. Omitted:
            the export carries every finding.
          schema: { type: string, enum: [findings] }
        - name: include
          in: query
          description: |
            `all` promotes a `format=bundle` export to the archival superset —
            the operator's enrichment and disclosure work product plus the
            notes/communications/references child records — for lossless
            round-trip into your own instance. The default bundle omits them so a
            cross-party share stays lean and leaks no internal workspace.
            Requires `format=bundle`; any other value, or use on the cross-repo
            `/v1/findings` and `/v1/scans` endpoints, gets a 400.
          schema: { type: string, enum: [all] }
        - name: severity
          in: query
          schema: { type: string, enum: [Critical, High, Medium, Low] }
        - name: status
          in: query
          schema:
            type: string
            enum: [new, enriched, triaged, ready, reported, acknowledged, fixed, published, rejected, duplicate]
      responses:
        '200':
          description: |
            JSONL stream (`format=jsonl`), a JSON sharing bundle
            (`format=bundle`), a SARIF 2.1.0 log (`format=sarif`), or armored
            age ciphertext (`format=bundle&encrypt=1`).
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/FindingExport' }
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ImportMinimal'
                  - type: object
                    description: SARIF 2.1.0 log (`format=sarif`), valid against the OASIS sarif-schema-2.1.0.json.
                    required: [version, runs]
            text/plain:
              schema:
                type: string
                description: Armored age ciphertext, starting `-----BEGIN AGE ENCRYPTED FILE-----`.
        '400':
          description: Unsupported `format`, `encrypt`/`include` without `format=bundle`, an unknown `scope`/`include` value, or encryption requested with no recipients configured.
        '403':
          description: Host header is not localhost
        '404':
          description: Repository not found

  /v1/findings:
    get:
      summary: Export findings across all repositories (JSONL or SARIF)
      description: |
        Returns one JSON object per line (`application/x-ndjson`). Operator
        token; localhost-only. Each line is a `FindingExport` carrying the
        full set of `db.Finding` columns. `format=sarif` returns a validated
        SARIF 2.1.0 log with one run per repository and observed revision.
        SARIF is built in memory, so exports with more than 10,000 findings
        after filtering return 400; use filters or streaming JSONL instead.
        An empty global SARIF selection produces an empty `runs` array.
      operationId: exportFindings
      security: [{ operatorToken: [] }]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [jsonl, sarif] }
        - name: severity
          in: query
          schema: { type: string, enum: [Critical, High, Medium, Low] }
        - name: status
          in: query
          schema:
            type: string
            enum: [new, enriched, triaged, ready, reported, acknowledged, fixed, published, rejected, duplicate]
        - name: sub_path
          in: query
          description: |
            Restrict to findings under a single monorepo sub-package. `.`
            selects root-scoped findings; empty includes all scopes.
          schema: { type: string }
        - name: scope
          in: query
          description: |
            `findings` curates the export to the Findings bucket (deep-dive and
            vuln-scan audits plus operator imports), excluding per-repo scanner
            noise. It combines with the other filters. Any other nonempty value
            gets a 400. Omitted: the export carries every finding.
          schema: { type: string, enum: [findings] }
        - name: repository_id
          in: query
          description: Restrict findings to this repository. A nonexistent ID returns an empty stream.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: since
          in: query
          description: |
            Include findings whose `created_at` is greater than or equal to this
            RFC3339 timestamp. UTC and numeric offsets represent the same instant;
            fractional seconds are preserved to nanosecond precision. Combine
            with any other filters using AND. This filters creation time, so it
            does not include older findings merely because they were updated later.
          schema: { type: string, format: date-time }
        - name: updated_since
          in: query
          description: |
            Include findings whose `updated_at` is greater than or equal to this
            RFC3339 timestamp. This covers both newly created findings and later
            modifications of existing ones. Offsets and precision behave as for
            `since`. Combine with any other filters using AND.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: JSONL findings stream or bounded SARIF 2.1.0 log.
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/FindingExport' }
            application/json:
              schema:
                type: object
                description: SARIF 2.1.0 log (`format=sarif`).
        '400':
          description: Invalid or empty repository_id, since or updated_since, unknown scope value, unsupported format query value, `encrypt`/`include` requested, or SARIF selection exceeds 10,000 findings. Validation and SARIF bounds checking complete before the response is written.
        '403':
          description: Host header is not localhost

  /v1/findings/{id}:
    get:
      summary: Get one finding
      description: |
        Returns one finding with the same shape as a line of the findings
        JSONL export, carrying the full set of `db.Finding` columns. Operator
        token; localhost-only. Not reachable with a per-scan bearer token.
      operationId: getFindingExport
      security: [{ operatorToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: The finding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FindingExport' }
        '400': { description: 'Invalid finding id, or an unsupported `format` or an `encrypt`, `scope` or `include` query value' }
        '403': { description: Host header is not localhost }
        '404': { description: Finding not found }
    delete:
      summary: Delete one finding and its linked data
      description: |
        Host-only operator endpoint for local automation. Removes the finding,
        labels join rows, notes, communications, references, history, reviews,
        exposure rows, and finding-scoped chat conversations. Scans that
        pointed at the finding are preserved with `finding_id` cleared. Not
        reachable with a per-scan bearer token.
      operationId: deleteFinding
      security: [{ operatorToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Finding deleted }
        '400': { description: Invalid finding id }
        '403': { description: Host header is not localhost }
        '404': { description: Finding not found }
        '409': { description: Finding has queued, running, or paused scans }
        '500': { description: Delete failed }

  /v1/scans:
    get:
      summary: Export scans across all repositories as JSONL
      description: |
        Returns one JSON object per line (`application/x-ndjson`). Operator
        token; localhost-only. Each line is a `ScanExport` carrying the full
        set of `db.Scan` columns minus `api_token` (the per-scan bearer must
        not leak through an instance-wide export).
      operationId: exportScans
      security: [{ operatorToken: [] }]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [jsonl] }
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, paused, done, failed, skipped, cancelled] }
        - name: skill
          in: query
          schema: { type: string }
        - name: repository_id
          in: query
          description: Restrict scans to this repository. A nonexistent ID returns an empty stream.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: kind
          in: query
          description: |
            Exact, case-sensitive match against the stored scan kind (for example,
            `skill`, `exposure`, `import` or `schedule`). Any nonempty string is accepted;
            unknown values return an empty stream. Empty means no kind filter.
          schema: { type: string }
        - name: since
          in: query
          description: |
            Include scans whose `created_at` is greater than or equal to this
            RFC3339 timestamp. UTC and numeric offsets represent the same instant;
            fractional seconds are preserved to nanosecond precision. Combine
            with any other filters using AND. This filters creation time, so it
            does not include older scans merely because they were updated later.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: JSONL stream of ScanExport objects, one per line.
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/ScanExport' }
        '400':
          description: Invalid or empty repository_id or since, unsupported format query value, or `encrypt`/`scope`/`include` requested (`scope` is only valid on the per-repository and `/v1/findings` exports, `encrypt`/`include` on per-repository bundle exports). Validation completes before streaming starts.
        '403':
          description: Host header is not localhost

  /v1/import:
    post:
      summary: Import externally-produced findings
      description: |
        Ingests a SARIF 2.1.0 document, a minimal JSON report, a findings
        CSV export, or a findings markdown export and creates Finding rows
        under a synthetic `Kind: import` scan. The format is sniffed from
        the body. The repository is taken from the body's own provenance
        (SARIF `versionControlProvenance`, the minimal-JSON `repository`
        field, the CSV `Repository` column, the markdown location link);
        when absent the caller must pass `?repo=`. Re-importing the same
        report dedupes by fingerprint and bumps `seen_count` rather than
        inserting duplicates. The scanner exports (SARIF, CSV, markdown)
        are raw rule output and are bounded on the way in: at most 5
        findings per rule and 50 per result are imported, in input order,
        with the drop counts reported in the response. Curated input
        imports whole.
        A body matching no supported format is
        routed to the `ingest` skill instead when `?repo=` is supplied:
        the raw payload is staged into the skill workspace and a scan is
        queued, returning 202 with the scan id. Age-encrypted bodies (armored
        or binary) are transparently decrypted first when an identity file or
        plugin is configured (`-identity-file` or `-identity-plugin`); plaintext
        bodies pass through untouched.
        Operator token; localhost-only. See docs/import.md for the per-format
        field mapping.
      operationId: importFindings
      security: [{ operatorToken: [] }]
      parameters:
        - name: repo
          in: query
          description: Repository URL to attribute findings to. Overrides any provenance in the body.
          schema: { type: string, format: uri }
        - name: revalidate
          in: query
          description: |
            Whether each newly-imported finding is enqueued for the
            `revalidate` pre-sort (which chains into `verify` on a confirmed
            High/Critical). Defaults to true. Pass `false` to import
            already-audited findings — e.g. a trusted sharing bundle — without
            priming the funnel. A value that is neither true/false nor 1/0 is a
            400.
          schema: { type: boolean, default: true }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ImportMinimal'
                - description: SARIF 2.1.0 document (see sarif-2.1.0 schema).
                  type: object
          text/csv:
            schema:
              type: string
              description: Header row must contain Severity, Repository, Name, Description.
          text/markdown:
            schema:
              type: string
              description: One H1 per finding with H2 sections and a `**Key:** value` metadata block.
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: |
                An age-encrypted bundle (armored or binary). Decrypted in place
                when an identity is configured, then ingested as the minimal
                JSON shape above.
      responses:
        '201':
          description: Findings created and/or re-observed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResponse' }
        '202':
          description: Unrecognised format routed to the ingest skill; a scan is queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: string, enum: [unrecognised] }
                  repository_id: { type: integer }
                  repository: { type: string }
                  scan_id: { type: integer }
                  skill: { type: string, enum: [ingest] }
                  status: { type: string, enum: [queued] }
        '400':
          description: Body unreadable or empty, or `revalidate` is not a boolean
        '403':
          description: Host header is not localhost
        '413':
          description: Body exceeds 16 MiB
        '422':
          description: Unrecognised format without `?repo=` (or with the ingest skill unavailable), recognised format that fails to parse, repository unknown, or an age-encrypted body received with no identity configured

  # =====================================================================
  # UI v2 JSON surface (/api/v1/ui/*): a BFF contract that moves with the
  # Svelte SPA. Conventions (02-api-plan.md section 2): list envelope
  # {items,total,page,page_size}; error envelope UIError with request_id;
  # ETag/If-Match on versioned writes; `x-status: planned` marks operations
  # documented but not implemented yet. Each wave-1 package edits only between
  # its own `# --- ui:<domain> begin/end ---` markers here and in
  # components.schemas. Schema names colliding with the skill API get a UI
  # prefix (UIFindingDetail, UIScanDetail, UIMaintainer, ...).
  # =====================================================================
  # --- ui:core begin --- (WP-API-0)
  /v1/ui/session:
    get:
      summary: Current operator session
      operationId: getUISession
      tags:
      - ui-core
      description: Registered outside requireOperator; checks the operator cookie/bearer itself. 401 envelope when not signed
        in.
      security:
      - {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '500':
          $ref: '#/components/responses/UIInternal'
    post:
      summary: Exchange a pasted operator token for the operator cookie
      operationId: createUISession
      tags:
      - ui-core
      security:
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionLogin'
      responses:
        '204':
          description: Signed in; Set-Cookie carries the operator cookie (HttpOnly, SameSite=Strict, 400 days)
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '400':
          $ref: '#/components/responses/UIBadParam'
        '403':
          $ref: '#/components/responses/UIForbidden'
        '500':
          $ref: '#/components/responses/UIInternal'
    delete:
      summary: Sign out (clear the operator cookie)
      operationId: deleteUISession
      tags:
      - ui-core
      security:
      - {}
      responses:
        '204':
          description: Cookie cleared
        '403':
          $ref: '#/components/responses/UIForbidden'
        '500':
          $ref: '#/components/responses/UIInternal'
  /v1/ui/meta:
    get:
      summary: Static vocabularies
      operationId: getUIMeta
      tags:
      - ui-core
      description: '`Cache-Control: max-age=3600`.'
      security:
      - operatorToken: []
      - operatorCookie: []
      responses:
        '200':
