        '500':
          $ref: '#/components/responses/UIInternal'
  /v1/ui/scans:
    get:
      summary: Paged scan list with queue stats
      operationId: listUIScans
      tags:
      - ui-core
      security:
      - operatorToken: []
      - operatorCookie: []
      parameters:
      - $ref: '#/components/parameters/UIPage'
      - name: page_size
        in: query
        schema:
          oneOf:
          - type: integer
            minimum: 1
            maximum: 200
          - type: string
            enum:
            - all
        description: Rows per page (default 20, max 200; `all` = 200).
      - name: sort
        in: query
        schema:
          type: string
        description: newest (default) | id | skill | status | repository | findings, optional .asc/.desc
      - name: skill
        in: query
        schema:
          type: string
        description: Comma-separated skill names
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - paused
          - done
          - failed
          - skipped
          - cancelled
      - name: completeness
        in: query
        schema:
          type: string
          enum:
          - complete
          - partial
          - unknown
      - name: group
        in: query
        schema:
          type: string
        description: scan_group
      - name: repository_id
        in: query
        schema:
          type: integer
          format: int64
      - name: finding_id
        in: query
        schema:
          type: integer
          format: int64
