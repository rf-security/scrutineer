  /v1/ui/settings/actions/restart-runner:
    post:
      summary: Restart the runner
      operationId: restartUIRunner
      tags:
      - ui-insights
      x-status: planned
      security:
      - operatorToken: []
      - operatorCookie: []
      responses:
        '202':
          description: Restarting
        '409':
          $ref: '#/components/responses/UIConflict'
        '401':
          $ref: '#/components/responses/UIUnauthorized'
        '500':
          $ref: '#/components/responses/UIInternal'
  # --- ui:insights end ---

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    operatorToken:
      type: http
      scheme: bearer
      description: |
        The operator token from `<data>/operator-token`. The browser UI
        sends it as the `operator` cookie that `/login` sets instead.

    operatorCookie:
      type: apiKey
      in: cookie
      name: operator-xxxxxxxx
      description: |
        The cookie `GET /login?token=` or `POST /v1/ui/session` sets. Its real
        name is `operator-<first 8 hex of sha256(token)>`, so two instances on
        one host do not sign each other out. The SPA authenticates with this
        cookie only (EventSource cannot send headers).

  parameters:
    RepositoryID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RepositoryReadLimit:
      name: limit
      in: query
      description: Maximum number of rows to return; defaults to 200 and is capped at 1000.
      schema: { type: integer, minimum: 0, maximum: 1000, default: 200 }

    # --- ui:core parameters begin --- (WP-API-0)
    UIPage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 1-based page
    UIPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    UISort:
      name: sort
      in: query
      schema:
        type: string
      description: Sort token `key` or `key.asc|.desc` (same tokens as the HTML UI); unknown keys fall back to the default
    UIQ:
      name: q
      in: query
      schema:
        type: string
      description: Free-text search
    UIPathID:
      name: id
      in: path
      schema:
        type: integer
        format: int64
      required: true
    UIIfMatch:
      name: If-Match
      in: header
      schema:
        type: string
      description: Quoted ETag (`"<updated_at RFC3339Nano>"`) from a prior GET/PATCH; absent or `*` = last-write-wins
    UIPrefer:
      name: Prefer
      in: header
      schema:
        type: string
        enum:
        - return=representation
      description: Return the full detail instead of the slim row
    # --- ui:core parameters end ---

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Token does not grant access to this resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed query or request body, or a missing required field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    # --- ui:core responses begin --- (WP-API-0)
    UIUnauthorized:
      description: Operator token missing or invalid (code unauthorized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UIForbidden:
      description: Forbidden (host check, cross-site write)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UINotFound:
      description: Not found (code not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UIBadParam:
      description: Malformed parameter or body (code bad_param)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UIValidationFailed:
      description: Validation failed (code validation_failed, with fields)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UIConflict:
      description: 'Conflict: stale If-Match (code conflict, with current), in_flight (with scan_id) or federation_claimed (with
        contacts)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UIPreconditionFailed:
      description: Precondition failed (skill missing, non-viable, no remediation attempt)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UINetwork:
      description: Upstream network failure (code network)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UIUnavailable:
      description: Feature unavailable (code unavailable)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    UIInternal:
      description: Internal error (code internal)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UIError'
    # --- ui:core responses end ---
  headers:
    # --- ui:core headers begin --- (WP-API-0)
    UIETag:
      description: Quoted updated_at in RFC3339Nano; echo in If-Match
      schema:
        type: string
    # --- ui:core headers end ---

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Repository:
      type: object
      required: [id, url, name]
      properties:
        id:             { type: integer, format: int64 }
        url:            { type: string, format: uri }
        name:           { type: string }
        full_name:      { type: string }
        default_branch: { type: string }
        html_url:       { type: string }
        stars:          { type: integer }
        forks:          { type: integer }
        archived:       { type: boolean }
        languages:      { type: string, description: Comma-joined language names. }
        license:        { type: string }
        fork:           { type: string, description: 'owner/name of the staging fork in fork_org, when one exists.' }
        posture:        { type: string, enum: [ready, partial, unprepared], description: 'Disclosure-readiness tier from the posture skill. Empty when posture has not run.' }
        posture_summary: { type: string }
        baseline_level: { type: integer, description: 'Highest OpenSSF Baseline level (1-3) whose applicable controls all passed on the latest compliance run. 0 when none did or when compliance has not run.' }
        health:            { type: string, enum: [active, stale, abandoned, zombie], description: 'Evidence-based maintenance classification. Empty when evidence is incomplete.' }

    RepositoryExport:
      description: |
        Compact repository row used by the operator JSONL export. This
        intentionally omits large metadata and ecosystems cache blobs.
      type: object
      required: [id, url, name, findings_count, last_scan]
      properties:
        id:             { type: integer, format: int64 }
        url:            { type: string, format: uri }
        name:           { type: string }
        full_name:      { type: string }
        owner:          { type: string }
        languages:      { type: string, description: Comma-joined language names. }
        stars:          { type: integer }
        findings_count: { type: integer, description: Curated open findings count matching the Repositories tab. }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
        last_scan:
          nullable: true
          type: object
          properties:
            id:          { type: integer, format: int64 }
            kind:        { type: string }
            status:      { type: string, enum: [queued, running, paused, done, failed, skipped, cancelled] }
            skill_name:  { type: string }
            commit:      { type: string }
            created_at:  { type: string, format: date-time, nullable: true }
            finished_at: { type: string, format: date-time, nullable: true }

    ExpectedFinding:
      type: object
      required: [id, repository_id, file, cwe]
      properties:
        id:            { type: integer, format: int64 }
        repository_id: { type: integer, format: int64 }
        file:          { type: string, description: Path relative to the repository root, without line number. }
        cwe:           { type: string, description: CWE identifier, e.g. CWE-79. }
        cve:           { type: string }
        note:          { type: string }

    Scan:
      type: object
      required: [id, kind, status, repository_id]
      properties:
        id:            { type: integer, format: int64 }
        repository_id: { type: integer, format: int64 }
        kind:          { type: string }
        status:        { type: string, enum: [queued, running, paused, done, failed, skipped, cancelled] }
        model:         { type: string }
        verification_feedback:
          type: string
          description: Optional operator guidance snapshotted on a finding-scoped verify scan, limited to 4000 UTF-8 bytes. Preserved on retries; not a verification verdict.
        commit:        { type: string }
        ref:           { type: string, description: Branch, tag, or commit requested for this scan. Omitted for the repository default branch. }
        sub_path:      { type: string, description: Monorepo sub-folder this scan was scoped to. Omitted for a repository-root scan. }
        rescan_mode:
          type: string
          enum: [full, diff]
          description: Requested or resolved scan mode.
        triage_scan_id:
          type: integer
          format: int64
          nullable: true
          description: Triage invocation that requested this pipeline scan.
        exploration_mode:
          type: string
          enum: ['', random-dig, adversarial-sweep]
          description: Empty or omitted for planned scans. Exploratory scans may only validate their own report through the callback API; random digs receive no threat-model context, while adversarial sweeps challenge one recorded exclusion.
        exploration_path:
          type: string
          description: Repository-relative source directory selected for an exploratory audit, or dot for root-level random source. Empty until a target is selected.
        diff_base_scan_id:
          type: integer
          format: int64
          nullable: true
          description: Baseline scan used for a diff rescan.
        diff_base_commit:
          type: string
          description: Baseline commit used to generate the staged diff.
        diff_threat_model_scan_id:
          type: integer
          format: int64
          nullable: true
          description: Prior threat-model scan staged as `old_threat_model.json`, when available.
        diff_stats:
          type: string
          description: JSON metadata for staged diff inputs, including changed files and size limits.
        remediation_attempt_id:
          type: integer
          format: int64
          nullable: true
          description: Immutable gated patch attempt pinned to a re-attack scan at enqueue time.
        coverage:
          type: string
          description: JSON coverage metadata, including diff fallback reasons, threat-model update decisions, and optional worker-owned capability preflight (static status ready/degraded/blocked, missing entries, degraded boolean and error). When enabled, preflight.backend records probe_id, receipt_id, config_hash, status ready/blocked, sanitized error, rate_limited, optional rate_limit_reset_at, checked_at, expires_at, reused, cost_usd and token counters. Probe usage is included once in the originating scan's totals. The receipt links the probe to the immutable claim-time recipe. Static shortfalls or a blocked live probe keep completeness partial.
        skill_name:           { type: string }
        skill_version:        { type: integer, description: Snapshot of the Skill row version at enqueue time. }
        skill_schema_version: { type: integer, description: Snapshot of metadata.scrutineer.version at enqueue time. }
        started_at:    { type: string, format: date-time, nullable: true }
        finished_at:   { type: string, format: date-time, nullable: true }
        max_turns_hit: { type: boolean, description: True when the scan completed with partial output after hitting the Claude max-turns cap; retry resumes the saved session when available. }
        max_cost_usd:  { type: number, minimum: 0, description: Optional per-scan spend cap in USD; 0 means no cap. }
        cost_capped:   { type: boolean, description: True when the scan completed with partial output because the running cost estimate reached max_cost_usd; retry resumes the saved session with a fresh budget. }
        refusal_audit_warning: { type: boolean, description: True when a security-deep-dive refusal audit reports declined or skipped analysis. }
        error:         { type: string }

    ScanDetail:
      allOf:
        - $ref: '#/components/schemas/Scan'
        - type: object
          properties:
            report: { type: string, description: Raw output report (may be JSON text). }
            refusal_audit: { type: string, description: Structured post-report security-deep-dive refusal audit. }
            log:    { type: string }

    Maintainer:
      type: object
      required: [id, login]
      properties:
        id:     { type: integer, format: int64 }
        login:  { type: string }
        name:   { type: string }
        email:  { type: string }
        status: { type: string, enum: [active, inactive, unknown] }
        notes:  { type: string }

    Package:
      type: object
      required: [id, name, ecosystem]
      properties:
        id:                 { type: integer, format: int64 }
        name:               { type: string }
        ecosystem:          { type: string }
        purl:               { type: string }
        latest_version:     { type: string }
        downloads:          { type: integer, format: int64 }
        dependent_packages: { type: integer }
        dependent_repos:    { type: integer }
        registry_url:       { type: string }
        latest_release_at:  { type: string, format: date-time, nullable: true }
        risk_flags:         { type: array, items: { type: string, enum: [single_maintainer, no_security_policy, native_extension, stale_release, maintainer_domain_expired] }, description: "Supply-chain hygiene warnings from the packages skill. The evidence for each stays in the scan report." }
        sub_path:           { type: string, description: "Monorepo sub-package this package is attributed to (its subproject path). Omitted for a repo-level package." }

    Advisory:
      type: object
      required: [id]
      properties:
        id:             { type: integer, format: int64 }
        uuid:           { type: string }
        url:            { type: string }
        title:          { type: string }
        severity:       { type: string }
        cvss_score:     { type: number }
        classification: { type: string }
        packages:       { type: string, description: Comma-joined affected package names. }
        published_at:   { type: string, format: date-time, nullable: true }
        withdrawn_at:   { type: string, format: date-time, nullable: true }

    Dependent:
      type: object
      required: [id, name, ecosystem]
      properties:
        id:              { type: integer, format: int64 }
        name:            { type: string }
        ecosystem:       { type: string }
        purl:            { type: string }
        repository_url:  { type: string }
        downloads:       { type: integer, format: int64 }
        dependent_repos: { type: integer }
        registry_url:    { type: string }
        latest_version:  { type: string }

    PackageAlternative:
      type: object
      required: [id, repository_id, purl, kind]
      properties:
        id:            { type: integer, format: int64 }
        repository_id: { type: integer, format: int64 }
        purl:          { type: string }
        kind:          { type: string, enum: [fork, successor, equivalent] }
        note:          { type: string }

    Dependency:
      type: object
      required: [id, name, ecosystem]
      properties:
        id:              { type: integer, format: int64 }
        name:            { type: string }
        ecosystem:       { type: string }
        purl:            { type: string }
        requirement:     { type: string }
        requirement_unresolved: { type: boolean }
        requirement_resolution: { type: string }
        dependency_type: { type: string, description: 'Normalised phase: runtime, dev, test, build, or an unrecognised source value.' }
        manifest_path:   { type: string }
        manifest_kind:   { type: string }

    DependencyFinding:
      type: object
      required: [package, ecosystem, finding_id, library_repository_id, severity]
      properties:
        package:               { type: string }
        ecosystem:             { type: string }
        requirement:           { type: string }
        manifest_path:         { type: string }
        dependency_type:       { type: string, description: 'Normalised phase: runtime, dev, test, build, or an unrecognised source value.' }
        finding_id:            { type: integer, format: int64 }
        library_repository_id: { type: integer, format: int64 }
        library_repository_url: { type: string, format: uri }
        title:                 { type: string }
        severity:              { type: string, enum: [Critical, High, Medium, Low] }
        cwe:                   { type: string }
        location:              { type: string, description: file:line inside the library }
        sinks:                 { type: string }
        status:                { type: string }
        trace:                 { type: string }
        boundary:              { type: string }

    FindingInput:
      type: object
      description: >
        One finding as it appears in a skill's report.json, streamed into the
        concurrent-finding log. Only title, severity and location are required;
        the other report.json finding fields (cwe, sinks, dup_check, trace, …)
        are accepted and stored. Scan-owned identity fields are ignored.
      required: [title, severity, location]
      additionalProperties: true
      properties:
        title:    { type: string }
        severity: { type: string, enum: [Critical, High, Medium, Low] }
        location: { type: string }
        cwe:      { type: string }
        sinks:    { type: array, items: { type: string } }
        dup_check: { type: string, description: "One sentence: which siblings under this scan_group you compared against and why this one is distinct." }

    FindingSummary:
      type: object
      required: [id, scan_id, repository_id, severity, location]
      properties:
        id:            { type: integer, format: int64 }
        scan_id:       { type: integer, format: int64 }
        repository_id: { type: integer, format: int64 }
        finding_id:    { type: string, description: Short id within the scan report (F1, F2, ...). }
        poc_capture_error: { type: string, description: "Present on streamed publication when the finding was saved but PoC capture failed." }
        sinks:         { type: string, description: Comma-joined sink ids. }
        title:         { type: string }
        sub_path:      { type: string, description: "Monorepo sub-folder the producing scan was scoped to. The finding's location is relative to it; empty means the repo root." }
        severity:      { type: string, enum: [Critical, High, Medium, Low] }
        severity_caps: { type: array, items: { type: string }, description: "Deterministic reasons that currently cap severity, derived from the latest reconciled verification controls and typed attacker prerequisites." }
        severity_calibration_incomplete: { type: boolean, description: "True when an unknown severity, unknown or unattempted prerequisite, unavailable control resolution, or unresolved control assessment prevented complete calibration; unknown inputs never lower severity." }
        status:        { type: string }
        cwe:           { type: string }
        location:      { type: string }
        vid:           { type: string, description: "Code identifier (VID-...) hashed from the sink code at the scanned commit; correlates findings across tools. Empty when not computed." }
        affected:      { type: string }
        reachability:  { type: string, enum: [reachable, harness_only, unclear] }
        quality_tier:  { type: string, enum: [high, low] }
        cve_id:        { type: string }
        ghsa_id:       { type: string, description: "GitHub Security Advisory id (GHSA-xxxx-xxxx-xxxx), set once the advisory is published." }
        cvss_vector:    { type: string, description: "CVSS v3.x base vector (3.0 or 3.1)." }
        cvss_score:     { type: number, description: "Base score derived from cvss_vector." }
        cvss_v4_vector: { type: string, description: "CVSS v4.0 base vector. Independent of cvss_vector; both may be populated." }
        cvss_v4_score:  { type: number, description: "Base score derived from cvss_v4_vector." }
        fix_version:   { type: string }
        fix_commit:    { type: string }
        resolution:    { type: string, enum: [fix, migrate, workaround, adopt, wontfix, ""] }
        assignee:      { type: string }
        exploited_in_wild: { type: string, enum: [yes, no, ""], description: "Analyst's call on whether this finding is being exploited in the wild. Empty means unknown. Automation never sets this." }
        dup_check:     { type: string, description: "Audit agent's one-sentence rationale for why this finding is distinct from the siblings already filed under the same scan_group. Empty for findings from skills that do not emit it." }
        novelty:       { type: string, enum: [unfixed, fixed, unclear, not_checked, ""], description: "Latest upstream novelty state. A touched file remains unclear until revalidate classifies the staged history." }
        production_viability: { type: string, enum: [VIABLE, NON_VIABLE, SAMPLE_OR_TEST, CONDITIONAL_VIABLE, ""], description: "Latest critic assessment of whether the finding can affect a real release build. Empty before assessment." }
        novelty_checked_commit: { type: string, description: "Repository HEAD compared with the finding's scanned commit for novelty." }
        novelty_checked_at: { type: string, format: date-time, nullable: true }

    FindingDetail:
      allOf:
        - $ref: '#/components/schemas/FindingSummary'
        - type: object
          description: Adds the six-step narrative and the disclosure draft/routing fields.
          properties:
            trace:            { type: string }
            boundary:         { type: string }
            validation:       { type: string }
            prior_art:        { type: string }
            reach:            { type: string }
            rating:           { type: string }
            disclosure_draft: { type: string }
            disclosure_title: { type: string, description: "The disclose skill's drafted GHSA summary; may differ from the finding's own title." }
            suggested_recipients: { type: string, description: "File-level owners for the finding's location, from CODEOWNERS or recent non-bot committers." }
            exploited_in_wild_evidence: { type: string, description: "Evidence supporting the analyst's exploitation status." }
            mitigation:    { type: string, description: "Markdown body of operational mitigation guidance from the mitigate skill: workarounds, detection, optionally a semgrep rule (see mitigation_semgrep)." }
            mitigation_semgrep: { type: string, description: "Optional YAML semgrep rule from the mitigate skill. Empty when no rule was warranted." }
            verification:
              allOf:
                - $ref: '#/components/schemas/FindingVerification'
              nullable: true
            attack_path:
              allOf:
                - $ref: '#/components/schemas/FindingAttackPath'
              nullable: true
            remediation:
              allOf:
                - $ref: '#/components/schemas/RemediationAttempt'
              nullable: true

    FindingVerification:
      type: object
      required: [id, scan_id, status, report, created_at]
      properties:
        id:         { type: integer, format: int64 }
        scan_id:    { type: integer, format: int64 }
        status:     { type: string, enum: [confirmed, fixed, inconclusive, deferred, not_attempted] }
        score:      { type: number, format: double, minimum: 0, maximum: 1, nullable: true, description: "Fraction of the five fixed verification criteria that passed. Null for legacy reports and reports that remain internally inconsistent after repair." }
        report:     { $ref: '#/components/schemas/VerificationReport' }
        created_at: { type: string, format: date-time }

    FindingAttackPath:
      type: object
      required: [id, scan_id, production_viability, report, created_at]
      properties:
        id:                   { type: integer, format: int64 }
        scan_id:              { type: integer, format: int64 }
        production_viability: { type: string, enum: [VIABLE, NON_VIABLE, SAMPLE_OR_TEST, CONDITIONAL_VIABLE] }
        report:               { $ref: '#/components/schemas/AttackPathReport' }
        created_at:           { type: string, format: date-time }

    AttackPathReport:
      type: object
      required: [production_viability, source_state, reason, counterevidence, attacker_position, preconditions, impact, likelihood, applied_adjustments, facts_that_would_change_the_result]
      additionalProperties: false
      properties:
        production_viability: { type: string, enum: [VIABLE, NON_VIABLE, SAMPLE_OR_TEST, CONDITIONAL_VIABLE] }
        source_state: { type: string, enum: [PRESENT, MOVED, MISSING, UNKNOWN] }
        reason: { type: string }
        counterevidence: { type: array, items: { type: string } }
        attacker_position: { type: string }
        preconditions: { type: array, items: { type: string } }
        impact: { type: string }
        likelihood: { type: string, enum: [likely, plausible, unlikely, unknown] }
        applied_adjustments:
          type: array
          maxItems: 0
          description: "Reserved for severity-cap calibration; critic emits an empty array."
          items:
            type: object
            required: [kind, reason, severity_before, severity_after]
            additionalProperties: false
            properties:
              kind: { type: string }
              reason: { type: string }
              severity_before: { type: string, enum: [Critical, High, Medium, Low] }
              severity_after: { type: string, enum: [Critical, High, Medium, Low] }
        facts_that_would_change_the_result: { type: array, items: { type: string } }

    RemediationAttempt:
      type: object
      required: [id, attempt, patch_scan_id, base_commit, status, created_at]
      properties:
        id:            { type: integer, format: int64 }
        attempt:       { type: integer, minimum: 1 }
        patch_scan_id: { type: integer, format: int64 }
        base_commit:   { type: string }
        status:        { type: string, enum: [verification_incomplete, bypassed_patch, verified_secure] }
        created_at:    { type: string, format: date-time }
        validation:
          allOf:
            - $ref: '#/components/schemas/RemediationValidation'
          nullable: true

    RemediationValidation:
      type: object
      required: [scan_id, outcome, valid_variants, benign_control_passed, bypass_input, created_at]
      properties:
        scan_id:               { type: integer, format: int64 }
        outcome:               { type: string, enum: [failed_to_bypass, bypassed_patch, inconclusive] }
        valid_variants:        { type: integer, minimum: 0 }
        benign_control_passed: { type: boolean }
        bypass_input:          { type: string }
        created_at:            { type: string, format: date-time }

    VerificationReport:
      type: object
      description: "Immutable verify output containing an evidenced attack tree, typed attacker prerequisites, three attempt records, five scored criteria, and a non-scored host-validated control-bypass gate. Historical reports may omit attack_tree, severity_prerequisites, or criteria.control_bypass. See skills/verify/schema.json for the current output contract."
      required: [status]
      additionalProperties: true
      properties:
        status: { type: string, enum: [confirmed, fixed, inconclusive, deferred, not_attempted] }
        attack_tree:
          type: object
          description: "Claim-specific attack path with a rooted parent-linked node set, per-node evidence, an overall reachable/blocked/unproven/not_attempted verdict, and concrete blockers."
          additionalProperties: true
          properties:
            goal: { type: string }
            root_id: { type: string }
            verdict: { type: string, enum: [reachable, blocked, unproven, not_attempted] }
            nodes:
              type: array
              items: { type: object, additionalProperties: true }
            blockers:
              type: array
              items: { type: string }
        severity_prerequisites:
          type: object
          description: "Evidence-backed inputs for deterministic severity caps. Required by the current verify contract; optional here only for historical stored reports. Unknown inputs mark calibration incomplete and never lower severity."
          required: [attacker_position, user_interaction, outcome_determinism, impact, existing_capability]
          additionalProperties: false
          properties:
            attacker_position:
              type: object
              required: [value, evidence]
              properties:
                value: { type: string, enum: [remote_unauthenticated, remote_authenticated, internal_authenticated, local, host_shell, long_term_physical, unknown, not_attempted] }
                evidence: { type: string }
            user_interaction:
              type: object
              required: [value, evidence]
              properties:
                value: { type: string, enum: [none, required, unknown, not_attempted] }
                evidence: { type: string }
            outcome_determinism:
              type: object
              required: [value, evidence]
              properties:
                value: { type: string, enum: [deterministic, probabilistic_llm, unknown, not_attempted] }
                evidence: { type: string }
            impact:
              type: object
              required: [value, evidence]
              properties:
                value: { type: string, enum: [code_execution_or_equivalent, privilege_escalation, sensitive_data_access, availability, other, unknown, not_attempted] }
                evidence: { type: string }
            existing_capability:
              type: object
              required: [value, evidence]
              properties:
                value: { type: string, enum: [none, less_than_outcome, support_channel_equivalent, equivalent_or_greater, unknown, not_attempted] }
                evidence: { type: string }
        attempts:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: object, additionalProperties: true }
        criteria:
          type: object
          additionalProperties: true
          properties:
            control_bypass:
              type: object
              required: [matched_controls, assessments]
              properties:
                matched_controls:
                  type: array
                  uniqueItems: true
                  items: { type: string }
                unavailable_reason:
                  type: string
                  description: "Exact host-staged reason control resolution failed; omitted when resolution succeeded or no controls exist."
                assessments:
                  type: array
                  items:
                    type: object
                    required: [control_id, disposition, evidence]
                    properties:
                      control_id: { type: string }
                      disposition: { type: string, enum: [bypassed, held, not_applicable, unresolved, not_attempted] }
                      evidence: { type: string }

    FindingExport:
      description: |
        Full db.Finding row used by the operator JSONL export. Adds
        the dedup, denormalised, release, triage, fix, federation and
        timestamp columns that the bearer-only FindingDetail leaves out.
      allOf:
        - $ref: '#/components/schemas/FindingDetail'
        - type: object
          properties:
            commit:            { type: string }
            model:
              type: string
              description: |
                Model id of the scan that first produced the finding,
                denormalised from that scan. For findings imported from a
                scrutineer sharing bundle it is the exporting instance's
                producing model; empty when no model attribution was
                recorded (deterministic imports, or rows predating model
                recording).
            fingerprint:       { type: string }
            last_seen_scan_id: { type: integer, format: int64 }
            last_seen_commit:  { type: string }
            seen_count:        { type: integer }
            missed_count:      { type: integer, description: "Consecutive same-skill full-repository rescans that did not report the finding again." }
            last_missed_scan_id: { type: integer, format: int64, description: "Latest rescan that did not report the finding; 0 when none has." }
            confidence:        { type: string, description: "How certain the producing audit is: high, medium or low. Empty when not reported." }
            locations:         { type: string, description: "Newline-joined file:line positions when one rule fired at many places. The first entry is also in location." }
            snippet:           { type: string, description: "Source excerpt around location, captured at ingest. Empty when it could not be read." }
            imported_from:     { type: string, description: "External producer for findings that arrived through /import, such as CodeQL. Empty for findings Scrutineer produced." }
            released_at:       { type: string, format: date-time, nullable: true, description: "When the upstream release that first contained the fix was published." }
            release_tag:       { type: string, description: "Tag of the upstream release that first contained the fix." }
            release_url:       { type: string, description: "URL of the upstream release that first contained the fix." }
            federation_claim_contacts: { type: string, description: "Comma-joined peer contacts returned by the last federation claim-check that found the same finding elsewhere." }
            federation_claim_at: { type: string, format: date-time, nullable: true, description: "When that federation claim was recorded." }
            last_revalidate_verdict: { type: string, enum: [true_positive, false_positive, already_fixed, uncertain, ""], description: "Latest revalidate verdict. Empty when revalidate has not run." }
            suggested_fix:     { type: string, description: "Unified diff from the patch skill that passed the applicability gate. Empty when none." }
            suggested_fix_commit: { type: string, description: "Commit the suggested fix applies to." }
            breaking_change:   { type: string, enum: [breaking, non_breaking, unknown, ""], description: "Breaking-change verdict for the suggested fix. Empty when the skill has not run." }
            breaking_change_rationale: { type: string, description: "Prose explaining the breaking-change verdict." }
            created_at:        { type: string, format: date-time }
            updated_at:        { type: string, format: date-time }

    ImportMinimal:
      description: |
        Minimal hand-written ingest shape for findings from a pentest writeup or
        a tool with no SARIF emitter. It is also the shape scrutineer's own
        `format=bundle` export emits and `/v1/import` round-trips: the seven base
        fields, the extended fields every bundle carries, and the archival fields
        an `include=all` bundle adds. Everything past the base seven is optional;
        a hand-written report or a bundle produced before a field existed simply
        omits it.
      type: object
      required: [findings]
      properties:
        repository: { type: string, format: uri }
        commit:     { type: string }
        tool:       { type: string, description: "Producer name; defaults to 'manual'." }
        findings:
          type: array
          items:
            type: object
            properties:
              title:       { type: string }
              description: { type: string }
              severity:    { type: string, enum: [critical, high, medium, low] }
              confidence:  { type: string, enum: [high, medium, low] }
              cwe:         { type: string }
              location:    { type: string, description: "path[:line[:col]]" }
              patch:       { type: string, description: "unified diff" }
              # Extended fields every scrutineer bundle carries (six-step audit
              # prose, provenance, correlation).
              commit:       { type: string, description: "Per-finding revision; falls back to the top-level commit." }
              sub_path:     { type: string }
              locations:    { type: string, description: "Newline-joined file:line hit set." }
              sinks:        { type: string, description: "Comma-joined sink ids." }
              vid:          { type: string }
              reachability: { type: string, enum: [reachable, harness_only, unclear] }
              quality_tier: { type: string, enum: [high, low] }
              boundary:     { type: string }
              validation:   { type: string }
              prior_art:    { type: string }
              reach:        { type: string }
              rating:       { type: string }
              fix_commit:   { type: string, description: "Base revision the patch applies to." }
              model:        { type: string, description: "Model id of the scan that produced the finding on the exporting instance; preserved as the finding's model on import. Dropped unless it looks like a model id (leading alphanumeric, id charset, at most 100 chars) — bundle text is externally supplied and this field feeds the reporting CSV." }
              # Archival fields, emitted only with include=all: the operator's
              # enrichment, disclosure work product, and child records.
              snippet:                    { type: string }
              affected:                   { type: string, description: "Vulnerable version range." }
              fix_version:                { type: string }
              cve_id:                     { type: string }
              ghsa_id:                    { type: string }
              cvss_vector:                { type: string, description: "v3.x base vector; score recomputed on import." }
              cvss_v4_vector:             { type: string, description: "v4.0 base vector; score recomputed on import." }
              mitigation:                 { type: string }
              mitigation_semgrep:         { type: string }
              breaking_change:            { type: string, enum: [breaking, non_breaking, unknown] }
              breaking_change_rationale:  { type: string }
              dup_check:                  { type: string }
              disclosure_draft:           { type: string }
              disclosure_title:           { type: string, description: "The disclose skill's drafted GHSA summary; may differ from the finding's own title." }
              suggested_recipients:       { type: string, description: "File-level owners for the finding's location, from CODEOWNERS or recent non-bot committers." }
              exploited_in_wild:          { type: string, enum: [yes, no] }
              exploited_in_wild_evidence: { type: string }
              upstream_fix_commit:        { type: string, description: "Real upstream fix commit (distinct from fix_commit)." }
              notes:
                type: array
                items:
                  type: object
                  properties:
                    body:       { type: string }
                    by:         { type: string }
                    created_at: { type: string, format: date-time }
              communications:
                type: array
                items:
                  type: object
                  properties:
                    channel:      { type: string, enum: [email, ghsa, issue, pr, direct, registry, vince, akrites] }
                    direction:    { type: string, enum: [outbound, inbound] }
                    actor:        { type: string }
                    body:         { type: string }
                    offered_help: { type: string, enum: [pr, funding, adoption, none] }
                    at:           { type: string, format: date-time }
                    created_at:   { type: string, format: date-time }
              references:
                type: array
                items:
                  type: object
                  properties:
                    url:        { type: string, format: uri }
                    tags:       { type: string, description: "Comma-joined: issue, pr, cve, ghsa, patch, advisory, discussion, article." }
                    summary:    { type: string }
                    created_at: { type: string, format: date-time }

    ImportResponse:
      type: object
      properties:
        format: { type: string, enum: [sarif, minimal, csv, markdown] }
        results:
          type: array
          items:
            type: object
            properties:
              repository_id: { type: integer, format: int64 }
              repository:    { type: string, format: uri }
              scan_id:       { type: integer, format: int64 }
              tool:          { type: string }
              created:       { type: integer }
              observed:      { type: integer }
              received:
                type: integer
                description: Findings the parser produced for this result, before the scanner caps.
              accepted:
                type: integer
                description: |
                  Findings that survived the scanner caps and were imported.
                  Equal to `received` for the curated formats. A scanner
                  export (SARIF, CSV, markdown) is capped at 5 findings per
                  rule and 50 per result.
              dropped_per_rule:
                type: integer
                description: Findings rejected by the per-rule cap.
              dropped_total_cap:
                type: integer
                description: |
                  Findings rejected by the per-result cap. A finding both caps
                  would reject counts against `dropped_per_rule` only, so the
                  two drop counts sum to `received` minus `accepted`.
              finding_ids:
                type: array
                items: { type: integer, format: int64 }

    ScanExport:
      description: |
        Full db.Scan row used by the operator JSONL export, minus
        api_token.
      allOf:
        - $ref: '#/components/schemas/ScanDetail'
        - type: object
          properties:
            skill_id:           { type: integer, format: int64, nullable: true }
            finding_id:         { type: integer, format: int64, nullable: true }
            sub_path:           { type: string }
            cost_usd:           { type: number }
            turns:              { type: integer }
            input_tokens:       { type: integer }
            output_tokens:      { type: integer }
            cache_read_tokens:  { type: integer }
            cache_write_tokens: { type: integer }
            prompt:             { type: string }
            findings_count:     { type: integer }
            created_at:         { type: string, format: date-time }
            updated_at:         { type: string, format: date-time }

    FindingNote:
      type: object
      required: [id, finding_id, body]
      properties:
        id:         { type: integer, format: int64 }
        finding_id: { type: integer, format: int64 }
        body:       { type: string }
        by:         { type: string }
        created_at: { type: string, format: date-time }

    FindingObservation:
      type: object
      required: [id, finding_id, scan_id]
      properties:
        id:                { type: integer, format: int64 }
        finding_id:        { type: integer, format: int64 }
        scan_id:           { type: integer, format: int64 }
        repository_id:     { type: integer, format: int64 }
        skill_name:        { type: string }
        backend:           { type: string }
        model:             { type: string }
        commit:            { type: string }
        report_finding_id: { type: string, description: The finding's id inside the scan report, e.g. F1 }
        fingerprint:       { type: string }
        title:             { type: string }
        severity:          { type: string }
        confidence:        { type: string }
        cwe:               { type: string }
        location:          { type: string }
        reachability:      { type: string }
        rating:            { type: string }
        evidence:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Unpromoted evidence fields the scan reported (locations, sinks, trace, boundary, validation, reach, affected, quality_tier, prior_art, dup_check)
        created_at:        { type: string, format: date-time }

    FindingReview:
      type: object
      required: [id, finding_id, verdict]
      properties:
        id:                { type: integer, format: int64 }
        finding_id:        { type: integer, format: int64 }
        verdict:           { type: string, enum: [true_positive, false_positive, already_fixed, uncertain] }
        reason:            { type: string }
        automated_outcome: { type: string, description: "Automation verdict snapshotted at review time. Empty when no revalidate run had spoken or the decision does not assess automation (such as a rejection-dialog decision); excluded from agreement metrics when empty." }
        reviewer:          { type: string }
        source_scan_id:    { type: integer, description: Observation scan at review time; zero on legacy reviews. }
        source_commit:     { type: string }
        finding_fingerprint: { type: string }
        finding_path:      { type: string, description: Repository-relative path at review time. }
        cwe:               { type: string }
        created_at:        { type: string, format: date-time }

    FindingCommunication:
      type: object
      required: [channel, direction, actor]
      properties:
        id:           { type: integer, format: int64 }
        finding_id:   { type: integer, format: int64 }
        channel:      { type: string, enum: [email, ghsa, issue, pr, direct, registry, vince, akrites] }
        direction:    { type: string, enum: [outbound, inbound] }
        actor:        { type: string }
        body:         { type: string }
        offered_help: { type: string, enum: [pr, funding, adoption, "none", ""] }
        at:           { type: string, format: date-time }
        created_at:   { type: string, format: date-time }

    FindingReference:
      type: object
      required: [url]
      properties:
        id:         { type: integer, format: int64 }
        finding_id: { type: integer, format: int64 }
        url:        { type: string, format: uri }
        tags:       { type: string, description: Comma-joined tags (issue, pr, cve, ghsa, patch, advisory, discussion, article). }
        summary:    { type: string }
        created_at: { type: string, format: date-time }

    FindingHistory:
      type: object
      required: [id, finding_id, field, new_value, source]
      properties:
        id:         { type: integer, format: int64 }
        finding_id: { type: integer, format: int64 }
        field:      { type: string }
        old_value:  { type: string }
        new_value:  { type: string }
        source:     { type: string, enum: [tool, model_suggested, analyst] }
        by:         { type: string }
        created_at: { type: string, format: date-time }

    SkillSummary:
      type: object
      required: [id, name, description]
      properties:
        id:          { type: integer, format: int64 }
        name:        { type: string }
        description: { type: string }
        output_kind: { type: string }
        output_file: { type: string }
        version:     { type: integer }
        active:      { type: boolean }

    # --- ui:core schemas begin --- (WP-API-0)
    UIError:
      type: object
      description: Error envelope returned by every /v1/ui route on 4xx/5xx.
      required:
      - error
      - code
      - request_id
      properties:
        error:
          type: string
          description: Human-readable message (kept a string so legacy writeAPIError callers are unchanged).
        code:
          type: string
          enum:
          - unauthorized
          - forbidden
          - not_found
          - bad_param
          - validation_failed
          - conflict
          - in_flight
          - precondition_failed
          - federation_claimed
          - network
          - unavailable
          - internal
        fields:
          type: object
          additionalProperties:
            type: string
          description: Per-field messages on 422 validation_failed.
        request_id:
          type: string
          description: Per-request id, also logged by the server, so toasts are greppable.
        current:
          description: Row projection of the entity on 409 conflict (FindingRow, RepoRow, ...).
          type: object
          additionalProperties: true
        scan_id:
          type: integer
          format: int64
          description: Existing in-flight scan on 409 in_flight.
        contacts:
          type: array
          items:
            type: string
          description: Federation peer contacts on 409 federation_claimed.
    ListPage:
      type: object
      description: Paging fields shared by every list envelope (`items` is added per list).
      required:
      - total
      - page
      - page_size
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        page_size:
          type: integer
    RepoRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Target:
      type: object
      description: Structured navigation target; the SPA owns its route table, so no hrefs are sent.
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - scan
          - finding
          - repository
        id:
          type: integer
          format: int64
        section:
          type: string
          description: Deep-link section token (disclosure|reviews|verification for findings; result|log|prompt for scans).
    Toast:
      type: object
      required:
      - category
      - title
      properties:
        category:
          type: string
          enum:
          - success
          - error
          - info
          - warning
        title:
          type: string
        description:
          type: string
        label:
          type: string
        target:
          oneOf:
          - $ref: '#/components/schemas/Target'
          - type: 'null'
    Label:
      type: object
      required:
      - id
      - name
      - color
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          description: '#rrggbb'
    LocationRef:
      type: object
      required:
      - path
      - line_start
      - line_end
      - commit
      properties:
        path:
          type: string
        line_start:
          type: integer
        line_end:
          type:
          - integer
          - 'null'
        commit:
          type: string
    EnqueueResult:
      type: object
      required:
      - scan_id
      properties:
        scan_id:
          type: integer
          format: int64
    EnqueueBatchResult:
      type: object
      required:
      - scan_ids
      - queued
      properties:
        scan_ids:
          type: array
          items:
            type: integer
            format: int64
        queued:
          type: integer
        skipped:
          type: integer
        errored:
          type: integer
        message:
          type: string
    BatchItemResult:
      type: object
      required:
      - id
      - ok
      properties:
        id:
          type: integer
          format: int64
        ok:
          type: boolean
        error:
          type: string
        code:
          type: string
        scan_id:
          type: integer
          format: int64
    BatchResult:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchItemResult'
        updated:
          type: integer
        failed:
          type: integer
        affected:
          type: integer
    VersionInfo:
      type: object
      required:
      - version
      - commit
