      - exploited_in_wild
      - page_size_default
      - page_size_max
      - repo_tabs
      properties:
        finding_statuses:
          type: array
          items:
            type: object
            required:
            - value
            - label
            - closed
            properties:
              value:
                type: string
              label:
                type: string
              closed:
                type: boolean
        severities:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        scan_statuses:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        cwe_categories:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        themes:
          type: array
          items:
            type: string
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        campaign_statuses:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        review_verdicts:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        offered_help:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        communication_channels:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        communication_directions:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        efforts:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        model_tiers:
          type: array
          items:
            type: string
        exploited_in_wild:
          type: array
          items:
            $ref: '#/components/schemas/LabelledValue'
        page_size_default:
          type: integer
        page_size_max:
          type: integer
        repo_tabs:
          type: object
          required:
          - tabs
          - legacy
          properties:
            tabs:
              type: array
              items:
                $ref: '#/components/schemas/RepoTab'
            legacy:
              type: object
              additionalProperties:
                type: string
    ModelOption:
      type: object
      required:
      - value
      - label
      properties:
        value:
          type: string
        label:
          type: string
        tier:
          type: string
    MetaDynamic:
      type: object
      required:
      - labels
      - skills_active
      - models
      - egress_policies
      - features
      - runner
      properties:
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        skills_active:
          type: array
          items:
            $ref: '#/components/schemas/UISkill'
        models:
